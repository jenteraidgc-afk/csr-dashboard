<!DOCTYPE html>
<html>
<head>
  <title>CSR Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="appbar">
    <div class="brand"><span class="mark">📊</span> CSR Dashboard</div>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Overview</a>
      <a href="appointments.html">Appointments</a>
      <a href="users.html" id="usersLink" style="display:none;">Users</a>
    </div>
    <span class="role-chip" id="roleChip" style="display:none;"></span>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>

  <div class="page">
    <div class="greeting-row">
      <div class="avatar-ring" id="avatarInitials">--</div>
      <div class="greeting-text">
        <div class="name" id="greetingName">Checking session...</div>
        <div class="role" id="greetingRole"></div>
      </div>
    </div>

    <h3 class="section-label">Summary</h3>
    <div id="kpiGrid" class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Loading</div><div class="kpi-value">&hellip;</div></div>
    </div>

    <div id="controls" class="form-box" style="display:none;"></div>

    <h3 class="section-label">Audit history</h3>
    <div id="details">Loading...</div>
    <div class="pagination">
      <button class="secondary" onclick="prevPage()">&larr; Previous</button>
      <button class="secondary" onclick="nextPage()">Next &rarr;</button>
      <span id="pageInfo"></span>
    </div>

    <div id="adminTool" class="admin-tool" style="display:none;">
      <h3>Admin: send a new PIN</h3>
      <div class="inline-fields">
        <input type="email" id="pinResetEmail" placeholder="user@example.com">
        <button onclick="sendPin()" style="white-space:nowrap;">Send new PIN</button>
      </div>
      <div id="pinResetResult" class="msg"></div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");
    var currentPage = 1;
    var currentRole = null;

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function initials(name) {
      if (!name) return "?";
      var parts = name.split(",")[0].trim().split(" ");
      return (parts[0][0] || "").toUpperCase();
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (data.valid) {
            currentRole = data.role;
            document.getElementById("avatarInitials").textContent = initials(data.name);
            document.getElementById("greetingName").textContent = data.name;
            document.getElementById("greetingRole").textContent = data.role;
            var chip = document.getElementById("roleChip");
            chip.textContent = data.role;
            chip.style.display = "inline-block";

            loadSummary();
            renderControls();
            if (currentRole === "Admin") {
              document.getElementById("adminTool").style.display = "block";
              document.getElementById("usersLink").style.display = "inline";
            }
          } else {
            sessionStorage.clear();
            window.location.href = "index.html";
          }
        });
    }

    // --- KPI rendering: turns the summary response into stat cards
    //     instead of a raw JSON dump. Shape differs by role. ---
    function scoreClass(score) {
      var n = parseFloat(score);
      if (isNaN(n)) return "";
      if (n >= 85) return "good";
      if (n >= 70) return "warn";
      return "bad";
    }

    function kpiCard(label, value, cls, sub) {
      return "<div class='kpi-card'>" +
        "<div class='kpi-label'>" + label + "</div>" +
        "<div class='kpi-value" + (cls ? " " + cls : "") + "'>" + value + "</div>" +
        (sub ? "<div class='kpi-sub'>" + sub + "</div>" : "") +
        "</div>";
    }

    function loadSummary() {
      jsonp(EXEC_URL + "?action=summary&token=" + encodeURIComponent(token))
        .then(function(data) {
          var grid = document.getElementById("kpiGrid");

          if (data.error) {
            grid.innerHTML = "<div class='kpi-card'><div class='kpi-label'>Error</div><div class='kpi-value bad' style='font-size:15px;'>" + data.error + "</div></div>";
            return;
          }

          if (currentRole === "Admin") {
            var teamCount = Object.keys(data.perTeamAverage || {}).length;
            grid.innerHTML =
              kpiCard("Org average", (data.orgAverage != null ? data.orgAverage : "-"), scoreClass(data.orgAverage)) +
              kpiCard("Total audits", data.totalAudits != null ? data.totalAudits : "-", "accent") +
              kpiCard("Teams tracked", teamCount, "accent") +
              kpiCard("Last synced", new Date(data.lastSynced).toLocaleString(), "", "auto-refreshes every 15\u201330 min");

            // team breakdown table
            var teamRows = Object.keys(data.perTeamAverage || {}).map(function(t) {
              return "<div class='row'><span class='k'>" + t + "</span><span class='v'>" + data.perTeamAverage[t] + "</span></div>";
            }).join("");
            if (teamRows) {
              grid.innerHTML += "";
              document.getElementById("kpiGrid").insertAdjacentHTML("afterend",
                "<div class='mini-table' id='teamBreakdown'>" + teamRows + "</div>");
            }

          } else if (currentRole === "Team Leader" || currentRole === "SME") {
            var quarters = data.quarterlyAverages || {};
            var quarterKeys = Object.keys(quarters);
            var latestQ = quarterKeys[quarterKeys.length - 1];
            var latestScore = latestQ ? quarters[latestQ] : null;

            grid.innerHTML =
              kpiCard("Latest quarter avg", latestScore != null ? latestScore : "-", scoreClass(latestScore), latestQ || "") +
              kpiCard("Org total audits", data.orgTotalAudits != null ? data.orgTotalAudits : "-", "accent") +
              kpiCard("Quarters tracked", quarterKeys.length, "accent") +
              kpiCard("Last synced", new Date(data.lastSynced).toLocaleString(), "", "");

            var qRows = quarterKeys.map(function(q) {
              return "<div class='row'><span class='k'>" + q + "</span><span class='v'>" + quarters[q] + "</span></div>";
            }).join("");
            if (qRows) {
              document.getElementById("kpiGrid").insertAdjacentHTML("afterend",
                "<div class='mini-table'>" + qRows + "</div>");
            }

          } else if (currentRole === "CSR") {
            grid.innerHTML =
              kpiCard("My average score", data.myAverage != null ? data.myAverage : "No data yet", scoreClass(data.myAverage)) +
              kpiCard("Last synced", new Date(data.lastSynced).toLocaleString(), "", "");
          }
        })
        .catch(function(err) {
          document.getElementById("kpiGrid").innerHTML = "<div class='kpi-card'><div class='kpi-label'>Error</div><div class='kpi-value bad' style='font-size:15px;'>Failed to load</div></div>";
          console.error(err);
        });
    }

    // --- Role-specific controls above the detail list ---
    function renderControls() {
      var el = document.getElementById("controls");

      if (currentRole === "Team Leader" || currentRole === "SME") {
        el.style.display = "block";
        el.innerHTML =
          "<div class='field-label'>Quarter</div>" +
          "<div class='inline-fields'>" +
          "<input type='text' id='quarterInput' placeholder='e.g. Q3 2025'>" +
          "<button onclick='applyFilters()' style='white-space:nowrap;'>Load</button>" +
          "</div>";

      } else if (currentRole === "Admin") {
        el.style.display = "block";
        el.innerHTML =
          "<div class='field-label'>Look up by CSR name</div>" +
          "<div class='inline-fields autocomplete-wrap'>" +
          "<input type='text' id='csrInput' placeholder='start typing a name...' autocomplete='off'>" +
          "<button onclick='applyFilters()' style='white-space:nowrap;'>Load</button>" +
          "<div id='csrSuggestions' class='suggestions'></div>" +
          "</div>" +
          "<div class='field-label'>Or by team + quarter</div>" +
          "<div class='inline-fields autocomplete-wrap'>" +
          "<input type='text' id='teamInput' placeholder='start typing a team...' autocomplete='off'>" +
          "<input type='text' id='quarterInput2' placeholder='e.g. Q3 2025'>" +
          "<button onclick='applyFilters()' style='white-space:nowrap;'>Load</button>" +
          "<div id='teamSuggestions' class='suggestions'></div>" +
          "</div>";

        wireAutocomplete("csrInput", "csrSuggestions", "searchCsr");
        wireAutocomplete("teamInput", "teamSuggestions", "searchTeam");

      } else {
        el.style.display = "none";
        loadDetails();
      }
    }

    function wireAutocomplete(inputId, suggestionsId, action) {
      var input = document.getElementById(inputId);
      var box = document.getElementById(suggestionsId);
      var debounceTimer = null;

      input.addEventListener("input", function() {
        clearTimeout(debounceTimer);
        var query = input.value.trim();
        if (!query) { box.style.display = "none"; return; }

        debounceTimer = setTimeout(function() {
          jsonp(EXEC_URL + "?action=" + action + "&token=" + encodeURIComponent(token) + "&q=" + encodeURIComponent(query))
            .then(function(data) {
              if (!data.matches || data.matches.length === 0) {
                box.style.display = "none";
                return;
              }
              box.innerHTML = data.matches.map(function(name) {
                return "<div onmousedown=\"selectSuggestion('" + inputId + "','" + suggestionsId + "','" + name.replace(/'/g, "\\'") + "')\">" + name + "</div>";
              }).join("");
              box.style.display = "block";
            });
        }, 400);
      });

      input.addEventListener("blur", function() {
        setTimeout(function() { box.style.display = "none"; }, 150);
      });
    }

    function selectSuggestion(inputId, suggestionsId, name) {
      document.getElementById(inputId).value = name;
      document.getElementById(suggestionsId).style.display = "none";
    }

    function applyFilters() {
      currentPage = 1;
      loadDetails();
    }

    function buildDetailsUrl() {
      var url = EXEC_URL + "?action=details&token=" + encodeURIComponent(token) +
                 "&page=" + currentPage + "&pageSize=10";

      if (currentRole === "Team Leader" || currentRole === "SME") {
        var q = document.getElementById("quarterInput").value.trim();
        if (!q) return null;
        url += "&quarter=" + encodeURIComponent(q);

      } else if (currentRole === "Admin") {
        var csr = document.getElementById("csrInput").value.trim();
        var team = document.getElementById("teamInput").value.trim();
        var quarter = document.getElementById("quarterInput2").value.trim();
        if (csr) {
          url += "&csr=" + encodeURIComponent(csr);
        } else if (team && quarter) {
          url += "&team=" + encodeURIComponent(team) + "&quarter=" + encodeURIComponent(quarter);
        } else {
          return null;
        }
      }
      return url;
    }

    function loadDetails() {
      var url = buildDetailsUrl();
      var detailsEl = document.getElementById("details");

      if (!url) {
        detailsEl.innerHTML = "<div class='empty-state'>Enter the required filter(s) above, then click Load.</div>";
        document.getElementById("pageInfo").textContent = "";
        return;
      }

      detailsEl.innerHTML = "<div class='empty-state'>Loading&hellip;</div>";
      jsonp(url)
        .then(function(data) {
          if (data.error) {
            detailsEl.innerHTML = "<div class='empty-state error'>" + data.error + "</div>";
            document.getElementById("pageInfo").textContent = "";
            return;
          }
          if (!data.records || data.records.length === 0) {
            detailsEl.innerHTML = "<div class='empty-state'>No records found.</div>";
          } else {
            var html = data.records.map(function(r) {
              return "<div class='card'>" +
                "<div class='card-row'>" +
                "<div style='display:flex; align-items:center; gap:12px;'>" +
                "<div class='score-ring " + (scoreClass(r["Ave Score"]) || "neutral") + "'>" + (r["Ave Score"] || "-") + "</div>" +
                "<div><div class='title'>" + (r["CSR Name"] || "") + "</div>" +
                "<div class='meta'>" + (r["Chat Date"] || "") + " &middot; " + (r["Main Category"] || "") + " / " + (r["Sub Category"] || "") + "</div></div>" +
                "</div>" +
                "</div>" +
                (r["Successes"] ? "<div><strong>Successes:</strong> " + r["Successes"] + "</div>" : "") +
                (r["Opportunities"] ? "<div><strong>Opportunities:</strong> " + r["Opportunities"] + "</div>" : "") +
                (r["Recommendations"] ? "<div><strong>Recommendations:</strong> " + r["Recommendations"] + "</div>" : "") +
                "</div>";
            }).join("");
            detailsEl.innerHTML = html;
          }
          document.getElementById("pageInfo").textContent = "Page " + data.page + " of " + data.totalPages + " (" + data.totalRecords + " total)";
        })
        .catch(function(err) {
          detailsEl.innerHTML = "<div class='empty-state error'>Error loading details.</div>";
          console.error(err);
        });
    }

    function nextPage() { currentPage++; loadDetails(); }
    function prevPage() { if (currentPage > 1) { currentPage--; loadDetails(); } }

    function sendPin() {
      var email = document.getElementById("pinResetEmail").value.trim();
      var resultEl = document.getElementById("pinResetResult");
      resultEl.textContent = "Sending...";

      jsonp(EXEC_URL + "?action=resetPin&token=" + encodeURIComponent(token) + "&email=" + encodeURIComponent(email))
        .then(function(data) {
          resultEl.textContent = data.success ? data.message : (data.error || "Something went wrong.");
        });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
