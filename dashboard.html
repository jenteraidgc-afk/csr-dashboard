<!DOCTYPE html>
<html>
<head>
  <title>CSR Dashboard</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; }
    #data { margin-top: 20px; padding: 16px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h2 id="greeting">Checking session...</h2>
  <button onclick="logout()">Log out</button>

  <h3>Your data:</h3>
  <div id="data">Loading...</div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (data.valid) {
            document.getElementById("greeting").textContent =
              "Welcome, " + data.name + " (" + data.role + ")";
            loadSummary();
          } else {
            sessionStorage.clear();
            window.location.href = "index.html";
          }
        });
    }

    function loadSummary() {
      jsonp(EXEC_URL + "?action=summary&token=" + encodeURIComponent(token))
        .then(function(data) {
          document.getElementById("data").textContent = JSON.stringify(data, null, 2);
        })
        .catch(function(err) {
          document.getElementById("data").textContent = "Error loading data.";
          console.error(err);
        });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
