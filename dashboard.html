<!DOCTYPE html>
<html>
<head>
  <title>CSR Dashboard</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 60px auto; padding: 0 16px; }
    #data { margin-top: 12px; padding: 16px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .record { border-bottom: 1px solid #ddd; padding: 10px 0; }
    .record .score { font-weight: bold; }
    .record .meta { color: #666; font-size: 13px; }
    button { padding: 6px 14px; cursor: pointer; margin-right: 6px; }
    input, select { padding: 6px; margin-right: 6px; }
    #pageInfo { margin-left: 8px; color: #666; }
    .controls { margin: 12px 0; padding: 12px; background: #fafafa; border-radius: 6px; }
    .error { color: #a33; }
    .top-links { margin: 10px 0; }
    .admin-tool { margin-top: 24px; padding: 12px; background: #fff8e0; border-radius: 6px; }
  </style>
</head>
<body>
  <h2 id="greeting">Checking session...</h2>
  <div class="top-links">
    <a href="appointments.html">Appointments</a>
    <a href="users.html" id="usersLink" style="display:none;"> &middot; Manage users</a>
    &middot;
    <button onclick="logout()">Log out</button>
  </div>

  <h3>Summary</h3>
  <div id="data">Loading...</div>

  <div id="controls" class="controls" style="display:none;"></div>

  <h3>Audit history</h3>
  <div id="details">Loading...</div>
  <div style="margin-top:10px;">
    <button onclick="prevPage()">Previous</button>
    <button onclick="nextPage()">Next</button>
    <span id="pageInfo"></span>
  </div>

  <div id="adminTool" class="admin-tool" style="display:none;">
    <h3>Admin: send a new PIN</h3>
    <input type="email" id="pinResetEmail" placeholder="user@example.com">
    <button onclick="sendPin()">Send new PIN by email</button>
    <div id="pinResetResult"></div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");
    var currentPage = 1;
    var currentRole = null;

    // Loads the Apps Script response via a <script> tag instead of fetch(),
    // since Apps Script's ContentService doesn't reliably send CORS headers
    // and a normal fetch() gets blocked by the browser.
    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (data.valid) {
            currentRole = data.role;
            document.getElementById("greeting").textContent =
              "Welcome, " + data.name + " (" + data.role + ")";
            loadSummary();
            renderControls();
            if (currentRole === "Admin") {
              document.getElementById("adminTool").style.display = "block";
              document.getElementById("usersLink").style.display = "inline";
            }
          } else {
            sessionStorage.clear();
            window.location.href = "index.html";
          }
        });
    }

    function loadSummary() {
      jsonp(EXEC_URL + "?action=summary&token=" + encodeURIComponent(token))
        .then(function(data) {
          document.getElementById("data").textContent = JSON.stringify(data, null, 2);
        })
        .catch(function(err) {
          document.getElementById("data").textContent = "Error loading summary.";
          console.error(err);
        });
    }

    // --- Role-specific controls above the detail list ---
    function renderControls() {
      var el = document.getElementById("controls");

      if (currentRole === "Team Leader" || currentRole === "SME") {
        el.style.display = "block";
        el.innerHTML =
          "Quarter: <input type='text' id='quarterInput' placeholder='e.g. Q3 2025' value=''>" +
          "<button onclick='applyFilters()'>Load</button>";

      } else if (currentRole === "Admin") {
        el.style.display = "block";
        el.innerHTML =
          "<div style='position:relative;'>Look up by CSR name: " +
          "<input type='text' id='csrInput' placeholder='start typing a name...' autocomplete='off'> " +
          "<button onclick='applyFilters()'>Load by CSR</button>" +
          "<div id='csrSuggestions' style='position:absolute; background:#fff; border:1px solid #ccc; border-radius:4px; z-index:10; display:none;'></div>" +
          "</div>" +
          "<div style='margin-top:8px; position:relative;'>Or by team + quarter: " +
          "<input type='text' id='teamInput' placeholder='start typing a team...' autocomplete='off'> " +
          "<input type='text' id='quarterInput2' placeholder='e.g. Q3 2025'> " +
          "<button onclick='applyFilters()'>Load by Team</button>" +
          "<div id='teamSuggestions' style='position:absolute; background:#fff; border:1px solid #ccc; border-radius:4px; z-index:10; display:none;'></div>" +
          "</div>";

        wireAutocomplete("csrInput", "csrSuggestions", "searchCsr");
        wireAutocomplete("teamInput", "teamSuggestions", "searchTeam");

      } else {
        // CSR — no extra controls needed, details load automatically
        el.style.display = "none";
        loadDetails();
      }
    }

    // Debounced (400ms) server-side search-as-you-type, backing an
    // autocomplete dropdown under the given input.
    function wireAutocomplete(inputId, suggestionsId, action) {
      var input = document.getElementById(inputId);
      var box = document.getElementById(suggestionsId);
      var debounceTimer = null;

      input.addEventListener("input", function() {
        clearTimeout(debounceTimer);
        var query = input.value.trim();
        if (!query) { box.style.display = "none"; return; }

        debounceTimer = setTimeout(function() {
          jsonp(EXEC_URL + "?action=" + action + "&token=" + encodeURIComponent(token) + "&q=" + encodeURIComponent(query))
            .then(function(data) {
              if (!data.matches || data.matches.length === 0) {
                box.style.display = "none";
                return;
              }
              box.innerHTML = data.matches.map(function(name) {
                return "<div style='padding:6px 10px; cursor:pointer;' onmousedown=\"selectSuggestion('" + inputId + "','" + suggestionsId + "','" + name.replace(/'/g, "\\'") + "')\">" + name + "</div>";
              }).join("");
              box.style.display = "block";
            });
        }, 400);
      });

      input.addEventListener("blur", function() {
        setTimeout(function() { box.style.display = "none"; }, 150); // slight delay so the click above still registers
      });
    }

    function selectSuggestion(inputId, suggestionsId, name) {
      document.getElementById(inputId).value = name;
      document.getElementById(suggestionsId).style.display = "none";
    }

    function applyFilters() {
      currentPage = 1;
      loadDetails();
    }

    function buildDetailsUrl() {
      var url = EXEC_URL + "?action=details&token=" + encodeURIComponent(token) +
                 "&page=" + currentPage + "&pageSize=10";

      if (currentRole === "Team Leader" || currentRole === "SME") {
        var q = document.getElementById("quarterInput").value.trim();
        if (!q) return null;
        url += "&quarter=" + encodeURIComponent(q);

      } else if (currentRole === "Admin") {
        var csr = document.getElementById("csrInput").value.trim();
        var team = document.getElementById("teamInput").value.trim();
        var quarter = document.getElementById("quarterInput2").value.trim();
        if (csr) {
          url += "&csr=" + encodeURIComponent(csr);
        } else if (team && quarter) {
          url += "&team=" + encodeURIComponent(team) + "&quarter=" + encodeURIComponent(quarter);
        } else {
          return null;
        }
      }
      return url;
    }

    function loadDetails() {
      var url = buildDetailsUrl();
      var detailsEl = document.getElementById("details");

      if (!url) {
        detailsEl.innerHTML = "<span class='error'>Enter the required filter(s) above, then click Load.</span>";
        document.getElementById("pageInfo").textContent = "";
        return;
      }

      detailsEl.textContent = "Loading...";
      jsonp(url)
        .then(function(data) {
          if (data.error) {
            detailsEl.innerHTML = "<span class='error'>" + data.error + "</span>";
            document.getElementById("pageInfo").textContent = "";
            return;
          }
          if (!data.records || data.records.length === 0) {
            detailsEl.textContent = "No records found.";
          } else {
            var html = data.records.map(function(r) {
              return "<div class='record'>" +
                "<div class='score'>" + (r["CSR Name"] ? r["CSR Name"] + " &mdash; " : "") + "Score: " + (r["Ave Score"] || "-") + "</div>" +
                "<div class='meta'>" + (r["Chat Date"] || "") + " &middot; " +
                (r["Main Category"] || "") + " / " + (r["Sub Category"] || "") + "</div>" +
                (r["Successes"] ? "<div><strong>Successes:</strong> " + r["Successes"] + "</div>" : "") +
                (r["Opportunities"] ? "<div><strong>Opportunities:</strong> " + r["Opportunities"] + "</div>" : "") +
                (r["Recommendations"] ? "<div><strong>Recommendations:</strong> " + r["Recommendations"] + "</div>" : "") +
                "</div>";
            }).join("");
            detailsEl.innerHTML = html;
          }
          document.getElementById("pageInfo").textContent = "Page " + data.page + " of " + data.totalPages + " (" + data.totalRecords + " total)";
        })
        .catch(function(err) {
          detailsEl.textContent = "Error loading details.";
          console.error(err);
        });
    }

    function nextPage() { currentPage++; loadDetails(); }
    function prevPage() { if (currentPage > 1) { currentPage--; loadDetails(); } }

    function sendPin() {
      var email = document.getElementById("pinResetEmail").value.trim();
      var resultEl = document.getElementById("pinResetResult");
      resultEl.textContent = "Sending...";

      jsonp(EXEC_URL + "?action=resetPin&token=" + encodeURIComponent(token) + "&email=" + encodeURIComponent(email))
        .then(function(data) {
          resultEl.textContent = data.success ? data.message : (data.error || "Something went wrong.");
        });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
