<!DOCTYPE html>
<html>
<head>
  <title>CSR Dashboard — Login</title>
  <style>
    body { font-family: sans-serif; max-width: 320px; margin: 80px auto; }
    input { display: block; width: 100%; margin-bottom: 12px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; cursor: pointer; }
    #error { color: red; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>CSR Dashboard</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="text" id="pin" placeholder="PIN" maxlength="6">
  <button onclick="login()">Sign in</button>
  <div id="error"></div>

  <script>
    var EXEC_URL = "PASTE_YOUR_EXEC_URL_HERE";

    // Loads the Apps Script response via a <script> tag instead of fetch(),
    // since Apps Script's ContentService doesn't reliably send CORS headers
    // and a normal fetch() gets blocked by the browser.
    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function login() {
      var email = document.getElementById("email").value.trim();
      var pin = document.getElementById("pin").value.trim();
      var errorEl = document.getElementById("error");
      errorEl.textContent = "";

      var url = EXEC_URL + "?action=login&email=" + encodeURIComponent(email) + "&pin=" + encodeURIComponent(pin);

      jsonp(url)
        .then(function(data) {
          if (data.success) {
            sessionStorage.setItem("token", data.token);
            sessionStorage.setItem("name", data.name);
            sessionStorage.setItem("role", data.role);
            window.location.href = "dashboard.html";
          } else {
            errorEl.textContent = data.error || "Login failed";
          }
        })
        .catch(function(err) {
          errorEl.textContent = "Network error — check the console.";
          console.error(err);
        });
    }
  </script>
</body>
</html>
