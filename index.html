<!DOCTYPE html>
<html>
<head>
  <title>CSR Dashboard — Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-screen">
    <div class="page narrow">
      <div style="text-align:center; margin-bottom:24px;">
        <h1>CSR Dashboard</h1>
        <p class="muted" style="margin-top:6px;">Sign in with your email and PIN</p>
      </div>

      <div class="panel">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="pin" placeholder="6-digit PIN" maxlength="6">
        <button onclick="login()" style="width:100%;">Sign in</button>
        <div id="error" class="error"></div>
      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function login() {
      var email = document.getElementById("email").value.trim();
      var pin = document.getElementById("pin").value.trim();
      var errorEl = document.getElementById("error");
      errorEl.textContent = "";

      var url = EXEC_URL + "?action=login&email=" + encodeURIComponent(email) + "&pin=" + encodeURIComponent(pin);

      jsonp(url)
        .then(function(data) {
          if (data.success) {
            sessionStorage.setItem("token", data.token);
            sessionStorage.setItem("name", data.name);
            sessionStorage.setItem("role", data.role);
            window.location.href = "dashboard.html";
          } else {
            errorEl.textContent = data.error || "Login failed";
          }
        })
        .catch(function(err) {
          errorEl.textContent = "Network error — check the console.";
          console.error(err);
        });
    }
  </script>
</body>
</html>
