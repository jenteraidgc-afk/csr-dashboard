<!DOCTYPE html>
<html>
<head>
  <title>CSR Dashboard — Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-screen">
    <div class="login-box">
      <div style="text-align:center; margin-bottom:20px;">
        <div style="width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--purple)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; margin:0 auto 12px;">CS</div>
        <h1>CSR Dashboard</h1>
        <p class="muted" style="margin-top:6px; font-size:12.5px;">Sign in with your email and password</p>
      </div>

      <div class="login-panel">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()" style="width:100%;">Sign in</button>
        <div id="error" class="error"></div>
      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function login() {
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value.trim();
      var errorEl = document.getElementById("error");
      errorEl.textContent = "";

      var url = EXEC_URL + "?action=login&email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password);

      jsonp(url)
        .then(function(data) {
          if (data.success) {
            sessionStorage.setItem("token", data.token);
            sessionStorage.setItem("name", data.name);
            sessionStorage.setItem("role", data.role);
            window.location.href = "dashboard.html";
          } else {
            errorEl.textContent = data.error || "Login failed";
          }
        })
        .catch(function(err) {
          errorEl.textContent = "Network error — check the console.";
          console.error(err);
        });
    }

    document.getElementById("password").addEventListener("keydown", function(e) {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
