<!DOCTYPE html>
<html>
<head>
  <title>Appointments</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 60px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .card .title { font-weight: bold; }
    .card .meta { color: #666; font-size: 13px; margin: 4px 0; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .status.Scheduled { background: #e0edff; color: #1a4b8c; }
    .status.Completed { background: #e0f5e0; color: #1a6b1a; }
    .status.Cancelled { background: #f5e0e0; color: #8c1a1a; }
    .status.Rescheduled { background: #fff3d6; color: #8c6a1a; }
    input, textarea, select { display: block; width: 100%; margin-bottom: 8px; padding: 6px; box-sizing: border-box; }
    button { padding: 6px 14px; cursor: pointer; margin-right: 6px; }
    .form-box { background: #fafafa; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
    .error { color: #a33; }
    .actions { margin-top: 8px; }
  </style>
</head>
<body>
  <a href="dashboard.html">&larr; Back to dashboard</a>
  <h2>Appointments</h2>

  <div class="form-box">
    <h3>New appointment</h3>
    <input type="date" id="newDate">
    <input type="time" id="newTime">
    <input type="text" id="newTitle" placeholder="Title">
    <textarea id="newDescription" placeholder="Description (optional)" rows="2"></textarea>
    <input type="text" id="newAssignedTo" placeholder="Assigned to (name)" style="display:none;">
    <input type="text" id="newTeam" placeholder="Team" style="display:none;">
    <button onclick="submitCreate()">Create</button>
    <div id="createError" class="error"></div>
  </div>

  <div id="list">Loading...</div>
  <div style="margin-top:10px;">
    <button onclick="prevPage()">Previous</button>
    <button onclick="nextPage()">Next</button>
    <span id="pageInfo"></span>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");
    var currentPage = 1;
    var currentRole = null;

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (!data.valid) {
            sessionStorage.clear();
            window.location.href = "index.html";
            return;
          }
          currentRole = data.role;
          if (currentRole === "Admin" || currentRole === "Team Leader" || currentRole === "SME") {
            document.getElementById("newAssignedTo").style.display = "block";
          }
          if (currentRole === "Admin") {
            document.getElementById("newTeam").style.display = "block";
          }
          loadList();
        });
    }

    function submitCreate() {
      var errorEl = document.getElementById("createError");
      errorEl.textContent = "";

      var date = document.getElementById("newDate").value;
      var time = document.getElementById("newTime").value;
      var title = document.getElementById("newTitle").value.trim();
      var description = document.getElementById("newDescription").value.trim();
      var assignedTo = document.getElementById("newAssignedTo").value.trim();
      var team = document.getElementById("newTeam").value.trim();

      if (!date || !time || !title) {
        errorEl.textContent = "Date, time, and title are required.";
        return;
      }

      var url = EXEC_URL + "?action=createAppointment&token=" + encodeURIComponent(token) +
                "&date=" + encodeURIComponent(date) +
                "&time=" + encodeURIComponent(time) +
                "&title=" + encodeURIComponent(title) +
                "&description=" + encodeURIComponent(description) +
                "&assignedTo=" + encodeURIComponent(assignedTo) +
                "&team=" + encodeURIComponent(team);

      jsonp(url).then(function(data) {
        if (data.error) {
          errorEl.textContent = data.error;
        } else {
          document.getElementById("newTitle").value = "";
          document.getElementById("newDescription").value = "";
          currentPage = 1;
          loadList();
        }
      });
    }

    function loadList() {
      var listEl = document.getElementById("list");
      listEl.textContent = "Loading...";

      jsonp(EXEC_URL + "?action=listAppointments&token=" + encodeURIComponent(token) + "&page=" + currentPage + "&pageSize=10")
        .then(function(data) {
          if (data.error) {
            listEl.innerHTML = "<span class='error'>" + data.error + "</span>";
            document.getElementById("pageInfo").textContent = "";
            return;
          }
          if (!data.records || data.records.length === 0) {
            listEl.textContent = "No appointments found.";
          } else {
            listEl.innerHTML = data.records.map(function(a) {
              return "<div class='card'>" +
                "<div class='title'>" + a["Title"] + " <span class='status " + a["Status"] + "'>" + a["Status"] + "</span></div>" +
                "<div class='meta'>" + a["Date"] + " " + a["Time"] + " &middot; Assigned to: " + (a["Assigned To"] || "-") + " &middot; Team: " + (a["Team"] || "-") + "</div>" +
                (a["Description"] ? "<div>" + a["Description"] + "</div>" : "") +
                "<div class='meta'>Created by " + a["Created By"] + "</div>" +
                "<div class='actions'>" +
                "<button onclick=\"changeStatus('" + a["Appointment ID"] + "','Completed')\">Complete</button>" +
                "<button onclick=\"changeStatus('" + a["Appointment ID"] + "','Cancelled')\">Cancel</button>" +
                "<button onclick=\"changeStatus('" + a["Appointment ID"] + "','Rescheduled')\">Mark Rescheduled</button>" +
                "</div>" +
                "</div>";
            }).join("");
          }
          document.getElementById("pageInfo").textContent = "Page " + data.page + " of " + data.totalPages + " (" + data.totalRecords + " total)";
        });
    }

    function changeStatus(id, newStatus) {
      var url = EXEC_URL + "?action=updateAppointment&token=" + encodeURIComponent(token) +
                "&id=" + encodeURIComponent(id) + "&status=" + encodeURIComponent(newStatus);
      jsonp(url).then(function(data) {
        if (data.error) {
          alert(data.error);
        } else {
          loadList();
        }
      });
    }

    function nextPage() { currentPage++; loadList(); }
    function prevPage() { if (currentPage > 1) { currentPage--; loadList(); } }
  </script>
</body>
</html>
