<!DOCTYPE html>
<html>
<head>
  <title>Appointments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="mark">CS</div>
        <div class="label"><div class="t">Audit CRM</div><div class="s">Quality Assurance</div></div>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          Overview
        </a>
        <a href="kpi.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M4 19V9M10 19V5M16 19v-7"/></svg></span>
          KPI Report
        </a>
        <a href="roster.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M15.5 3.5a3.2 3.2 0 0 1 0 6"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Roster
        </a>
        <a href="appointments.html" class="active">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          Appointments
        </a>
        <a href="users.html" id="usersLink" style="display:none;">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="18" cy="8.5" r="2.5"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Users
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="user-row">
          <div class="avatar" id="avatarInitials">--</div>
          <div style="min-width:0;">
            <div class="name" id="greetingName">&nbsp;</div>
            <span class="role-badge" id="roleChip"></span>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="content">
      <div class="topbar">
        <div>
          <h1>Appointments</h1>
          <div class="subtitle">Schedule, reschedule, and track coaching sessions</div>
        </div>
      </div>

      <div class="page-body">

        <div class="form-box">
          <div class="panel-head">New appointment</div>
          <div class="inline-fields">
            <input type="date" id="newDate">
            <input type="time" id="newTime">
          </div>
          <input type="text" id="newTitle" placeholder="Title">
          <textarea id="newDescription" placeholder="Description (optional)" rows="2"></textarea>
          <input type="text" id="newAssignedTo" placeholder="Assigned to (name)" style="display:none;">
          <input type="text" id="newTeam" placeholder="Team" style="display:none;">
          <button onclick="submitCreate()">Create appointment</button>
          <div id="createError" class="error"></div>
        </div>

        <div id="list">Loading...</div>
        <div class="pagination">
          <button class="secondary" onclick="prevPage()">&larr; Previous</button>
          <button class="secondary" onclick="nextPage()">Next &rarr;</button>
          <span id="pageInfo"></span>
          <span style="flex:1;"></span>
          <label class="muted" style="font-size:12px;">Per page:
            <select id="pageSizeSelect" onchange="changePageSize()" style="width:auto; display:inline-block; margin-bottom:0; margin-left:4px;">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>

      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");
    var currentPage = 1;
    var currentPageSize = 25;
    var currentRole = null;

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function initials(name) {
      if (!name) return "?";
      var parts = name.split(",")[0].trim().split(" ");
      return (parts[0][0] || "").toUpperCase();
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (!data.valid) {
            sessionStorage.clear();
            window.location.href = "index.html";
            return;
          }
          currentRole = data.role;
          document.getElementById("avatarInitials").textContent = initials(data.name);
          document.getElementById("greetingName").textContent = data.name;
          document.getElementById("roleChip").textContent = data.role;

          if (currentRole === "Admin" || currentRole === "Team Leader" || currentRole === "SME") {
            document.getElementById("newAssignedTo").style.display = "block";
          }
          if (currentRole === "Admin") {
            document.getElementById("newTeam").style.display = "block";
            document.getElementById("usersLink").style.display = "flex";
          }
          loadList();
        });
    }

    function submitCreate() {
      var errorEl = document.getElementById("createError");
      errorEl.textContent = "";

      var date = document.getElementById("newDate").value;
      var time = document.getElementById("newTime").value;
      var title = document.getElementById("newTitle").value.trim();
      var description = document.getElementById("newDescription").value.trim();
      var assignedTo = document.getElementById("newAssignedTo").value.trim();
      var team = document.getElementById("newTeam").value.trim();

      if (!date || !time || !title) {
        errorEl.textContent = "Date, time, and title are required.";
        return;
      }

      var url = EXEC_URL + "?action=createAppointment&token=" + encodeURIComponent(token) +
                "&date=" + encodeURIComponent(date) +
                "&time=" + encodeURIComponent(time) +
                "&title=" + encodeURIComponent(title) +
                "&description=" + encodeURIComponent(description) +
                "&assignedTo=" + encodeURIComponent(assignedTo) +
                "&team=" + encodeURIComponent(team);

      jsonp(url).then(function(data) {
        if (data.error) {
          errorEl.textContent = data.error;
        } else {
          document.getElementById("newTitle").value = "";
          document.getElementById("newDescription").value = "";
          currentPage = 1;
          loadList();
        }
      });
    }

    function loadList() {
      var listEl = document.getElementById("list");
      listEl.innerHTML = "<div class='empty-state'>Loading&hellip;</div>";

      jsonp(EXEC_URL + "?action=listAppointments&token=" + encodeURIComponent(token) + "&page=" + currentPage + "&pageSize=" + currentPageSize)
        .then(function(data) {
          if (data.error) {
            listEl.innerHTML = "<div class='empty-state' style='color:var(--bad);'>" + data.error + "</div>";
            document.getElementById("pageInfo").textContent = "";
            return;
          }
          var records = data.records || [];
          if (records.length === 0) {
            listEl.innerHTML = "<div class='empty-state'>No appointments found.</div>";
          } else {
            listEl.innerHTML = records.map(function(a, idx) {
              return "<div class='card'>" +
                "<div class='card-row'>" +
                "<div class='title'>" + a["Title"] + "</div>" +
                "<span class='status-tag " + a["Status"] + "'>" + a["Status"] + "</span>" +
                "</div>" +
                "<div class='meta'>" + a["Date"] + " " + a["Time"] + " &middot; Assigned to: " + (a["Assigned To"] || "-") + " &middot; Team: " + (a["Team"] || "-") + "</div>" +
                (a["Description"] ? "<div style='margin-top:4px;'>" + a["Description"] + "</div>" : "") +
                "<div class='meta' style='margin-top:4px;'>Created by " + a["Created By"] + "</div>" +
                "<div class='btn-row'>" +
                "<button class='secondary' onclick=\"changeStatus('" + a["Appointment ID"] + "','Completed')\">Complete</button>" +
                "<button class='secondary' onclick=\"changeStatus('" + a["Appointment ID"] + "','Cancelled')\">Cancel</button>" +
                "<button class='secondary' onclick=\"toggleEdit(" + idx + ")\">Reschedule / edit</button>" +
                "</div>" +
                "<div class='edit-box' id='edit-" + idx + "'>" +
                  "<div class='inline-fields'>" +
                    "<input type='date' id='editDate-" + idx + "' value='" + a["Date"] + "'>" +
                    "<input type='time' id='editTime-" + idx + "' value='" + a["Time"] + "'>" +
                  "</div>" +
                  "<input type='text' id='editTitle-" + idx + "' value='" + (a["Title"] || "").replace(/'/g, "&#39;") + "'>" +
                  "<textarea id='editDesc-" + idx + "' rows='2'>" + (a["Description"] || "") + "</textarea>" +
                  "<div class='btn-row'>" +
                  "<button onclick=\"saveEdit('" + a["Appointment ID"] + "', " + idx + ")\">Save changes</button>" +
                  "<button class='secondary' onclick=\"toggleEdit(" + idx + ")\">Cancel edit</button>" +
                  "</div>" +
                "</div>" +
                "</div>";
            }).join("");
          }
          document.getElementById("pageInfo").textContent = "Page " + data.page + " of " + data.totalPages + " (" + data.totalRecords + " total)";
        });
    }

    function toggleEdit(idx) {
      document.getElementById("edit-" + idx).classList.toggle("open");
    }

    function saveEdit(id, idx) {
      var date = document.getElementById("editDate-" + idx).value;
      var time = document.getElementById("editTime-" + idx).value;
      var title = document.getElementById("editTitle-" + idx).value.trim();
      var description = document.getElementById("editDesc-" + idx).value.trim();

      if (!date || !time || !title) {
        alert("Date, time, and title are required.");
        return;
      }

      var url = EXEC_URL + "?action=updateAppointment&token=" + encodeURIComponent(token) +
                "&id=" + encodeURIComponent(id) +
                "&date=" + encodeURIComponent(date) +
                "&time=" + encodeURIComponent(time) +
                "&title=" + encodeURIComponent(title) +
                "&description=" + encodeURIComponent(description) +
                "&status=" + encodeURIComponent("Rescheduled");

      jsonp(url).then(function(data) {
        if (data.error) {
          alert(data.error);
        } else {
          loadList();
        }
      });
    }

    function changeStatus(id, newStatus) {
      var url = EXEC_URL + "?action=updateAppointment&token=" + encodeURIComponent(token) +
                "&id=" + encodeURIComponent(id) + "&status=" + encodeURIComponent(newStatus);
      jsonp(url).then(function(data) {
        if (data.error) {
          alert(data.error);
        } else {
          loadList();
        }
      });
    }

    function nextPage() { currentPage++; loadList(); }
    function prevPage() { if (currentPage > 1) { currentPage--; loadList(); } }
    function changePageSize() {
      currentPageSize = parseInt(document.getElementById("pageSizeSelect").value, 10);
      currentPage = 1;
      loadList();
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
