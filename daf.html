<!DOCTYPE html>
<html>
<head>
  <title>DAF Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .daf-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .daf-row:last-child { border-bottom: none; }
    .daf-points { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; }
    .daf-points.zero { color: var(--good); }
    .daf-points.some { color: var(--warn); }
    .daf-points.high { color: var(--bad); }
    .infraction-row { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .infraction-row:last-child { border-bottom: none; }
    .infraction-row .top { display: flex; justify-content: space-between; }
    .infraction-row .valid-tag { font-size: 10px; padding: 1px 7px; border-radius: 8px; }
    .infraction-row .valid-tag.yes { background: var(--bad-quiet); color: var(--bad); }
    .infraction-row .valid-tag.no { background: var(--good-quiet); color: var(--good); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="mark">CS</div>
        <div class="label"><div class="t">Audit CRM</div><div class="s">Quality Assurance</div></div>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          Overview
        </a>
        <a href="kpi.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M4 19V9M10 19V5M16 19v-7"/></svg></span>
          KPI Report
        </a>
        <a href="roster.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M15.5 3.5a3.2 3.2 0 0 1 0 6"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Roster
        </a>
        <a href="daf.html" class="active">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.6 6.9L22 10l-5.5 4.8L18 22l-6-3.6L6 22l1.5-7.2L2 10l7.4-1.1L12 2z"/></svg></span>
          DAF Tracker
        </a>
        <a href="appointments.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          Appointments
        </a>
        <a href="users.html" id="usersLink" style="display:none;">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="18" cy="8.5" r="2.5"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Users
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="user-row">
          <div class="avatar" id="avatarInitials">--</div>
          <div style="min-width:0;">
            <div class="name" id="greetingName">&nbsp;</div>
            <span class="role-badge" id="roleChip"></span>
          </div>
        </div>
        <button class="logout-btn" onclick="togglePasswordPanel()" style="display:none;" id="changePwBtn">Change password</button>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>
    <div class="content">
      <div class="topbar">
        <div>
          <h1>DAF Tracker</h1>
          <div class="subtitle">Disciplinary points and infraction log &mdash; points/infractions only</div>
        </div>
      </div>

      <div class="page-body">

        <div class="form-box" id="csrLookupBox">
          <div class="field-label">View a specific CSR's infraction history</div>
          <div class="inline-fields autocomplete-wrap">
            <input type="text" id="csrLookupInput" placeholder="start typing a name..." autocomplete="off">
            <div id="csrSuggestions" class="suggestions"></div>
            <button onclick="loadCsrDetail()" style="white-space:nowrap;">View</button>
          </div>
        </div>

        <div id="dafError" class="error"></div>
        <div id="dafView">Loading&hellip;</div>

      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");
    var currentRole = null;
    var currentName = null;

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function initials(name) {
      if (!name) return "?";
      var parts = name.split(",")[0].trim().split(" ");
      return (parts[0][0] || "").toUpperCase();
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (!data.valid) {
            sessionStorage.clear();
            window.location.href = "index.html";
            return;
          }
          currentRole = data.role;
          currentName = data.name;
          document.getElementById("avatarInitials").textContent = initials(data.name);
          document.getElementById("greetingName").textContent = data.name;
          document.getElementById("roleChip").textContent = data.role;
          document.getElementById("changePwBtn").style.display = "none";

          if (currentRole === "Admin") {
            document.getElementById("usersLink").style.display = "flex";
          }

          if (currentRole === "CSR") {
            document.getElementById("csrLookupBox").style.display = "none";
            loadCsrDetail(currentName);
          } else {
            if (currentRole === "Admin") {
              wireAutocomplete("csrLookupInput", "csrSuggestions", "searchCsr");
            } else {
              document.getElementById("csrLookupInput").placeholder = "start typing a name from your team...";
            }
            loadList();
          }
        });
    }

    function wireAutocomplete(inputId, suggestionsId, action) {
      var input = document.getElementById(inputId);
      var box = document.getElementById(suggestionsId);
      var debounceTimer = null;

      input.addEventListener("input", function() {
        clearTimeout(debounceTimer);
        var query = input.value.trim();
        if (!query) { box.style.display = "none"; return; }

        debounceTimer = setTimeout(function() {
          jsonp(EXEC_URL + "?action=" + action + "&token=" + encodeURIComponent(token) + "&q=" + encodeURIComponent(query))
            .then(function(data) {
              if (!data.matches || data.matches.length === 0) { box.style.display = "none"; return; }
              box.innerHTML = data.matches.map(function(name) {
                return "<div onmousedown=\"document.getElementById('" + inputId + "').value='" + name.replace(/'/g, "\\'") + "'; document.getElementById('" + suggestionsId + "').style.display='none';\">" + name + "</div>";
              }).join("");
              box.style.display = "block";
            });
        }, 400);
      });

      input.addEventListener("blur", function() {
        setTimeout(function() { box.style.display = "none"; }, 150);
      });
    }

    function pointsClass(pts) {
      if (pts === 0) return "zero";
      if (pts < 10) return "some";
      return "high";
    }

    function loadList() {
      var viewEl = document.getElementById("dafView");
      viewEl.innerHTML = "<div class='empty-state'>Loading&hellip;</div>";

      jsonp(EXEC_URL + "?action=dafOverview&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (data.error) {
            viewEl.innerHTML = "";
            document.getElementById("dafError").textContent = data.error;
            return;
          }
          document.getElementById("dafError").textContent = "";
          if (!data.records || data.records.length === 0) {
            viewEl.innerHTML = "<div class='empty-state'>No DAF records found.</div>";
            return;
          }
          viewEl.innerHTML = "<div class='panel'><div class='panel-head'>Points leaderboard</div>" +
            data.records.map(function(r, i) {
              return "<div class='daf-row' style='cursor:pointer;' onclick=\"loadCsrDetail('" + r.csr.replace(/'/g, "\\'") + "')\">" +
                "<div><strong>" + r.csr + "</strong><div class='meta'>" + (r.immediateHead || "") + " &middot; " + r.infractionCount + " infraction(s)</div></div>" +
                "<div class='daf-points " + pointsClass(r.totalPoints) + "'>" + r.totalPoints + " pts</div>" +
                "</div>";
            }).join("") + "</div>";
        });
    }

    function loadCsrDetail(csrArg) {
      var csr = csrArg || document.getElementById("csrLookupInput").value.trim();
      if (!csr) { document.getElementById("dafError").textContent = "Enter a CSR name."; return; }

      var viewEl = document.getElementById("dafView");
      viewEl.innerHTML = "<div class='empty-state'>Loading&hellip;</div>";
      document.getElementById("dafError").textContent = "";

      jsonp(EXEC_URL + "?action=dafOverview&token=" + encodeURIComponent(token) + "&csr=" + encodeURIComponent(csr))
        .then(function(data) {
          if (data.error) {
            viewEl.innerHTML = "";
            document.getElementById("dafError").textContent = data.error;
            return;
          }
          var infractions = data.infractions || [];
          var backLink = currentRole !== "CSR" ? "<div style='margin-bottom:10px;'><a href='#' onclick='loadList(); return false;'>&larr; Back to leaderboard</a></div>" : "";

          viewEl.innerHTML = backLink +
            "<div class='kpi-grid' style='margin-bottom:14px;'>" +
            "<div class='kpi-card'><div class='kpi-body'><div class='kpi-label'>" + data.csr + "</div><div class='kpi-value " + pointsClass(data.totalPoints || 0) + "' style='color:var(--" + (pointsClass(data.totalPoints || 0) === 'zero' ? 'good' : pointsClass(data.totalPoints || 0) === 'some' ? 'warn' : 'bad') + ");'>" + (data.totalPoints != null ? data.totalPoints : "-") + "</div><div class='kpi-sub'>Total points</div></div></div>" +
            "<div class='kpi-card'><div class='kpi-body'><div class='kpi-label'>Immediate Head</div><div class='kpi-value' style='font-size:15px;'>" + (data.immediateHead || "-") + "</div></div></div>" +
            "<div class='kpi-card'><div class='kpi-body'><div class='kpi-label'>Infractions logged</div><div class='kpi-value'>" + infractions.length + "</div></div></div>" +
            "</div>" +
            "<div class='panel'><div class='panel-head'>Infraction log</div>" +
            (infractions.length === 0 ? "<div class='empty-row'>No infractions on record.</div>" : infractions.map(function(inf) {
              var validStr = String(inf.valid).toUpperCase();
              var isValid = validStr === "TRUE";
              return "<div class='infraction-row'>" +
                "<div class='top'><strong>" + (inf.infraction || "") + "</strong>" +
                "<span class='valid-tag " + (isValid ? "yes" : "no") + "'>" + (isValid ? "Valid" : "Not valid") + "</span></div>" +
                "<div class='meta'>" + (inf.date || "") + (inf.pointGiven ? " &middot; " + inf.pointGiven + " pt(s)" : "") + "</div>" +
                (inf.remarks ? "<div style='margin-top:2px;'>" + inf.remarks + "</div>" : "") +
                "</div>";
            }).join("")) +
            "</div>";
        });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
