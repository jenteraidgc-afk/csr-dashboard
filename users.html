<!DOCTYPE html>
<html>
<head>
  <title>User Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="mark">CS</div>
        <div class="label"><div class="t">Audit CRM</div><div class="s">Quality Assurance</div></div>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          Overview
        </a>
        <a href="kpi.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M4 19V9M10 19V5M16 19v-7"/></svg></span>
          KPI Report
        </a>
        <a href="roster.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M15.5 3.5a3.2 3.2 0 0 1 0 6"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Roster
        </a>
        <a href="appointments.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          Appointments
        </a>
        <a href="users.html" class="active">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="18" cy="8.5" r="2.5"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Users
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="user-row">
          <div class="avatar" id="avatarInitials">--</div>
          <div style="min-width:0;">
            <div class="name" id="greetingName">&nbsp;</div>
            <span class="role-badge" id="roleChip"></span>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="content">
      <div class="topbar">
        <div>
          <h1>User management</h1>
          <div class="subtitle">Add, deactivate, and reassign roles</div>
        </div>
      </div>

      <div class="page-body">
        <p id="accessDenied" class="error" style="display:none;">Admin access required.</p>

        <div id="content" style="display:none;">
          <div class="form-box">
            <div class="panel-head">Add user</div>
            <input type="text" id="newName" placeholder="Full name">
            <input type="email" id="newEmail" placeholder="Email">
            <select id="newRole">
              <option value="Admin">Admin</option>
              <option value="Team Leader">Team Leader</option>
              <option value="SME">SME</option>
              <option value="CSR" selected>CSR</option>
            </select>
            <button onclick="submitCreate()">Add &amp; email password</button>
            <div id="createMsg"></div>
          </div>

          <div id="userList">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function initials(name) {
      if (!name) return "?";
      var parts = name.split(",")[0].trim().split(" ");
      return (parts[0][0] || "").toUpperCase();
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (!data.valid) {
            sessionStorage.clear();
            window.location.href = "index.html";
            return;
          }
          document.getElementById("avatarInitials").textContent = initials(data.name);
          document.getElementById("greetingName").textContent = data.name;
          document.getElementById("roleChip").textContent = data.role;

          if (data.role !== "Admin") {
            document.getElementById("accessDenied").style.display = "block";
            return;
          }
          document.getElementById("content").style.display = "block";
          loadUsers();
        });
    }

    function submitCreate() {
      var msgEl = document.getElementById("createMsg");
      msgEl.textContent = "";
      msgEl.className = "";

      var name = document.getElementById("newName").value.trim();
      var email = document.getElementById("newEmail").value.trim();
      var role = document.getElementById("newRole").value;

      if (!name || !email) {
        msgEl.textContent = "Name and email are required.";
        msgEl.className = "error";
        return;
      }

      var url = EXEC_URL + "?action=createUser&token=" + encodeURIComponent(token) +
                "&name=" + encodeURIComponent(name) +
                "&email=" + encodeURIComponent(email) +
                "&role=" + encodeURIComponent(role);

      jsonp(url).then(function(data) {
        if (data.error) {
          msgEl.textContent = data.error;
          msgEl.className = "error";
        } else {
          msgEl.textContent = data.message;
          msgEl.className = "msg";
          document.getElementById("newName").value = "";
          document.getElementById("newEmail").value = "";
          loadUsers();
        }
      });
    }

    function loadUsers() {
      var listEl = document.getElementById("userList");
      listEl.innerHTML = "<div class='empty-state'>Loading&hellip;</div>";

      jsonp(EXEC_URL + "?action=listUsers&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (data.error) {
            listEl.innerHTML = "<div class='empty-state' style='color:var(--bad);'>" + data.error + "</div>";
            return;
          }
          if (!data.users || data.users.length === 0) {
            listEl.innerHTML = "<div class='empty-state'>No users found.</div>";
            return;
          }
          listEl.innerHTML = data.users.map(function(u) {
            var safeEmail = u.email.replace(/'/g, "\\'");
            return "<div class='card'>" +
              "<div class='card-row'>" +
                "<div style='display:flex; align-items:center; gap:11px;'>" +
                  "<div class='avatar' style='width:32px; height:32px; font-size:12.5px; background:var(--accent-quiet); color:var(--accent);'>" + (u.name ? u.name.charAt(0).toUpperCase() : "?") + "</div>" +
                  "<div>" +
                    "<div class='title'>" + u.name + " <span class='status-tag " + u.status + "'>" + u.status + "</span></div>" +
                    "<div class='meta'>" + u.email + " &middot; " + u.role + "</div>" +
                  "</div>" +
                "</div>" +
              "</div>" +
              "<div class='btn-row'>" +
                "<select onchange=\"changeRole('" + safeEmail + "', this.value)\" style='width:auto; margin-bottom:0;'>" +
                  ["Admin", "Team Leader", "SME", "CSR"].map(function(r) {
                    return "<option value='" + r + "'" + (r === u.role ? " selected" : "") + ">" + r + "</option>";
                  }).join("") +
                "</select>" +
                "<button class='secondary' onclick=\"toggleStatus('" + safeEmail + "', '" + (u.status === "Active" ? "Inactive" : "Active") + "')\">" +
                  (u.status === "Active" ? "Deactivate" : "Activate") +
                "</button>" +
              "</div>" +
            "</div>";
          }).join("");
        });
    }

    function changeRole(email, newRole) {
      jsonp(EXEC_URL + "?action=updateUser&token=" + encodeURIComponent(token) +
            "&email=" + encodeURIComponent(email) + "&role=" + encodeURIComponent(newRole))
        .then(function(data) {
          if (data.error) alert(data.error);
          loadUsers();
        });
    }

    function toggleStatus(email, newStatus) {
      jsonp(EXEC_URL + "?action=updateUser&token=" + encodeURIComponent(token) +
            "&email=" + encodeURIComponent(email) + "&status=" + encodeURIComponent(newStatus))
        .then(function(data) {
          if (data.error) alert(data.error);
          loadUsers();
        });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
