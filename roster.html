<!DOCTYPE html>
<html>
<head>
  <title>Roster</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .roster-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .roster-avg { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); }
    .dnd-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .dnd-col { background: var(--bg); border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 12px; min-height: 160px; }
    .dnd-col.dragover { border-color: var(--accent); background: var(--accent-quiet); }
    .dnd-col-title { font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .dnd-chip {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 11px; margin-bottom: 6px; cursor: grab; font-size: 12.5px;
    }
    .dnd-chip:active { cursor: grabbing; }
    .dnd-chip .score { font-family: var(--font-mono); font-weight: 700; font-size: 12px; }
    .dnd-chip .score.good { color: var(--good); }
    .dnd-chip .score.warn { color: var(--warn); }
    .dnd-chip .score.bad { color: var(--bad); }
    .dnd-empty { color: var(--text-faint); font-size: 12px; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="mark">CS</div>
        <div class="label"><div class="t">Audit CRM</div><div class="s">Quality Assurance</div></div>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          Overview
        </a>
        <a href="kpi.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M4 19V9M10 19V5M16 19v-7"/></svg></span>
          KPI Report
        </a>
        <a href="roster.html" class="active">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M15.5 3.5a3.2 3.2 0 0 1 0 6"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Roster
        </a>
        <a href="appointments.html">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          Appointments
        </a>
        <a href="users.html" id="usersLink" style="display:none;">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="18" cy="8.5" r="2.5"/><path d="M16 14.2c2.6.4 4.5 2.4 4.5 5.3"/></svg></span>
          Users
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="user-row">
          <div class="avatar" id="avatarInitials">--</div>
          <div style="min-width:0;">
            <div class="name" id="greetingName">&nbsp;</div>
            <span class="role-badge" id="roleChip"></span>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="content">
      <div class="topbar">
        <div>
          <h1>Roster</h1>
          <div class="subtitle">Drag CSRs between columns to assign them to a team's roster</div>
        </div>
      </div>

      <div class="page-body">

        <div class="form-box">
          <div class="inline-fields" style="align-items:flex-end;">
            <div style="flex:1; display:none;" id="teamFieldWrap">
              <div class="field-label">Team leader</div>
              <select id="teamSelect"><option value="">Select a team&hellip;</option></select>
            </div>
            <div style="flex:1;">
              <div class="field-label">Quarter</div>
              <select id="quarterSelect"><option value="">Select a quarter&hellip;</option></select>
            </div>
            <button onclick="loadRoster()" style="white-space:nowrap;">Load roster</button>
          </div>
          <div id="lookupError" class="error"></div>
        </div>

        <div id="rosterView"></div>

      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbyD9esDoJQrcSprufwsEQugkdbUZwSsQ-6eYih1M9b7uVe859yprQD4U6p9g9bj1Kw-/exec";
    var token = sessionStorage.getItem("token");
    var currentRole = null;
    var currentTeam = null;
    var currentQuarter = null;
    var draggedCsr = null;

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "cb_" + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };
        var script = document.createElement("script");
        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          reject(new Error("Request failed"));
          delete window[callbackName];
        };
        document.body.appendChild(script);
      });
    }

    function initials(name) {
      if (!name) return "?";
      var parts = name.split(",")[0].trim().split(" ");
      return (parts[0][0] || "").toUpperCase();
    }

    if (!token) {
      window.location.href = "index.html";
    } else {
      jsonp(EXEC_URL + "?action=whoami&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (!data.valid) {
            sessionStorage.clear();
            window.location.href = "index.html";
            return;
          }
          currentRole = data.role;
          document.getElementById("avatarInitials").textContent = initials(data.name);
          document.getElementById("greetingName").textContent = data.name;
          document.getElementById("roleChip").textContent = data.role;

          if (currentRole === "Admin") {
            document.getElementById("usersLink").style.display = "flex";
            document.getElementById("teamFieldWrap").style.display = "block";
            populateSelect("teamSelect", "listTeams", "teams");
          } else if (currentRole !== "Team Leader" && currentRole !== "SME") {
            document.getElementById("rosterView").innerHTML = "<div class='empty-state'>Roster is only available to Admin, Team Leader, and SME roles.</div>";
            document.querySelector(".form-box").style.display = "none";
          }

          populateSelect("quarterSelect", "listQuarters", "quarters");
        });
    }

    function populateSelect(selectId, action, key) {
      jsonp(EXEC_URL + "?action=" + action + "&token=" + encodeURIComponent(token))
        .then(function(data) {
          if (data.error || !data[key]) return;
          var sel = document.getElementById(selectId);
          data[key].forEach(function(val) {
            var opt = document.createElement("option");
            opt.value = val;
            opt.textContent = val;
            sel.appendChild(opt);
          });
        });
    }

    function formatQuarterLabel(q) {
      var m = /^Q(\d)\s+(\d{4})$/.exec((q || "").trim());
      if (!m) return q;
      return "Quarter " + m[1] + " - " + m[2];
    }

    function firstNameOf(fullName) {
      if (!fullName) return "";
      var afterComma = fullName.indexOf(",") >= 0 ? fullName.split(",")[1] : fullName;
      return afterComma.trim().split(" ")[0];
    }

    function scoreClass(score) {
      var n = parseFloat(score);
      if (isNaN(n)) return "";
      if (n >= 85) return "good";
      if (n >= 70) return "warn";
      return "bad";
    }

    function loadRoster() {
      var errorEl = document.getElementById("lookupError");
      errorEl.textContent = "";

      var quarter = document.getElementById("quarterSelect").value;
      if (!quarter) { errorEl.textContent = "Select a quarter."; return; }

      var url = EXEC_URL + "?action=listRoster&token=" + encodeURIComponent(token) + "&quarter=" + encodeURIComponent(quarter);
      if (currentRole === "Admin") {
        var team = document.getElementById("teamSelect").value;
        if (!team) { errorEl.textContent = "Select a team."; return; }
        url += "&team=" + encodeURIComponent(team);
      }

      document.getElementById("rosterView").innerHTML = "<div class='empty-state'>Loading&hellip;</div>";

      jsonp(url).then(function(data) {
        if (data.error) {
          document.getElementById("rosterView").innerHTML = "";
          errorEl.textContent = data.error;
          return;
        }
        currentTeam = data.teamLeader;
        currentQuarter = data.quarter;
        renderRoster(data);
      });
    }

    function chipHtml(csr, score, inRoster) {
      return "<div class='dnd-chip' draggable='true' data-csr='" + csr.replace(/'/g, "&#39;") + "' " +
        "ondragstart=\"onDragStart(event, '" + csr.replace(/'/g, "\\'") + "')\">" +
        "<span>" + csr + "</span>" +
        (inRoster ? "<span class='score " + scoreClass(score) + "'>" + (score != null ? score + "%" : "no data") + "</span>" : "") +
        "</div>";
    }

    function renderRoster(data) {
      var title = "Team " + firstNameOf(data.teamLeader) + " &mdash; " + formatQuarterLabel(data.quarter);
      var avg = data.teamQuarterAverage != null ? data.teamQuarterAverage + "%" : "No audit data for this quarter";

      var memberChips = data.members.length === 0
        ? "<div class='dnd-empty'>Drag CSRs here to add them to the roster.</div>"
        : data.members.map(function(m) { return chipHtml(m.csr, m.quarterAverage, true); }).join("");

      var availableChips = data.availableCsrs.length === 0
        ? "<div class='dnd-empty'>No other CSRs found for this team.</div>"
        : data.availableCsrs.map(function(csr) { return chipHtml(csr, null, false); }).join("");

      document.getElementById("rosterView").innerHTML =
        "<div class='panel'>" +
        "<div class='roster-title'>" + title + "</div>" +
        "<div class='roster-avg'>Team average this quarter: " + avg + "</div>" +
        "<div class='dnd-columns'>" +
        "<div class='dnd-col' id='availableCol' ondragover='onDragOver(event)' ondragleave='onDragLeave(event)' ondrop=\"onDrop(event, 'available')\">" +
        "<div class='dnd-col-title'>Available CSRs</div>" + availableChips +
        "</div>" +
        "<div class='dnd-col' id='rosterCol' ondragover='onDragOver(event)' ondragleave='onDragLeave(event)' ondrop=\"onDrop(event, 'roster')\">" +
        "<div class='dnd-col-title'>On roster</div>" + memberChips +
        "</div>" +
        "</div>" +
        "</div>";
    }

    function onDragStart(ev, csr) {
      draggedCsr = csr;
      ev.dataTransfer.setData("text/plain", csr);
    }

    function onDragOver(ev) {
      ev.preventDefault();
      ev.currentTarget.classList.add("dragover");
    }

    function onDragLeave(ev) {
      ev.currentTarget.classList.remove("dragover");
    }

    function onDrop(ev, targetColumn) {
      ev.preventDefault();
      ev.currentTarget.classList.remove("dragover");
      if (!draggedCsr) return;

      var csr = draggedCsr;
      draggedCsr = null;

      if (targetColumn === "roster") {
        addMember(csr);
      } else {
        removeMember(csr);
      }
    }

    function addMember(csr) {
      var url = EXEC_URL + "?action=addToRoster&token=" + encodeURIComponent(token) +
                "&quarter=" + encodeURIComponent(currentQuarter) + "&csr=" + encodeURIComponent(csr);
      if (currentRole === "Admin") url += "&team=" + encodeURIComponent(currentTeam);

      jsonp(url).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadRoster();
      });
    }

    function removeMember(csr) {
      var url = EXEC_URL + "?action=removeFromRoster&token=" + encodeURIComponent(token) +
                "&quarter=" + encodeURIComponent(currentQuarter) + "&csr=" + encodeURIComponent(csr);
      if (currentRole === "Admin") url += "&team=" + encodeURIComponent(currentTeam);

      jsonp(url).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadRoster();
      });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
